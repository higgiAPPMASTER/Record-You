openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Music recorder API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: songs
    description: Song management
  - name: comments
    description: Feedback comments on shared songs
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /songs:
    get:
      operationId: listSongs
      tags: [songs]
      summary: List all songs
      responses:
        "200":
          description: List of songs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Song"
    post:
      operationId: createSong
      tags: [songs]
      summary: Create a new song
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SongInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"

  /songs/stats:
    get:
      operationId: getSongStats
      tags: [songs]
      summary: Get song statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongStats"

  /songs/{id}:
    get:
      operationId: getSong
      tags: [songs]
      summary: Get a single song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Song
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "404":
          description: Not found
    patch:
      operationId: updateSong
      tags: [songs]
      summary: Update a song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SongUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "404":
          description: Not found
    delete:
      operationId: deleteSong
      tags: [songs]
      summary: Delete a song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /songs/{id}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments on a song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Post a comment on a song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          description: Song not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Song:
      type: object
      required: [id, title, hasAudio, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        notes:
          type: ["string", "null"]
        tags:
          type: ["string", "null"]
        duration:
          type: ["number", "null"]
          description: Duration in seconds
        audioUrl:
          type: ["string", "null"]
          description: URL to stream the audio file
        hasAudio:
          type: boolean
        waveformData:
          type: ["array", "null"]
          items:
            type: number
          description: Amplitude peak values (0–1) for waveform visualization
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SongInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        notes:
          type: string
        tags:
          type: string

    SongUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        notes:
          type: string
        tags:
          type: string

    Comment:
      type: object
      required: [id, songId, author, body, createdAt]
      properties:
        id:
          type: integer
        songId:
          type: integer
        author:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    CommentInput:
      type: object
      required: [author, body]
      properties:
        author:
          type: string
          minLength: 1
          maxLength: 60
        body:
          type: string
          minLength: 1
          maxLength: 2000

    SongStats:
      type: object
      required: [totalSongs, totalDuration, songsWithAudio, recentSongs]
      properties:
        totalSongs:
          type: integer
        totalDuration:
          type: number
          description: Total duration of all songs in seconds
        songsWithAudio:
          type: integer
        recentSongs:
          type: array
          items:
            $ref: "#/components/schemas/Song"
