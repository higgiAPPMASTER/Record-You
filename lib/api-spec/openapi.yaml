openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Music recorder API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: songs
    description: Song management
  - name: comments
    description: Feedback comments on shared songs
  - name: takes
    description: Collaborator audio layers added to a song
  - name: musicians
    description: Musician profiles for local discovery
paths:
  /musicians:
    get:
      operationId: listMusicians
      tags: [musicians]
      summary: List musician profiles
      parameters:
        - in: query
          name: lat
          schema: { type: number }
        - in: query
          name: lng
          schema: { type: number }
        - in: query
          name: radius
          schema: { type: number }
          description: Radius in km (default 100)
      responses:
        "200":
          description: List of musicians
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Musician"
    post:
      operationId: createMusician
      tags: [musicians]
      summary: Create a musician profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MusicianInput"
      responses:
        "201":
          description: Created musician
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Musician"

  /musicians/{id}:
    get:
      operationId: getMusician
      tags: [musicians]
      summary: Get a musician profile
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Musician profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Musician"
    patch:
      operationId: updateMusician
      tags: [musicians]
      summary: Update a musician profile
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MusicianInput"
      responses:
        "200":
          description: Updated musician
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Musician"
    delete:
      operationId: deleteMusician
      tags: [musicians]
      summary: Delete a musician profile
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /songs:
    get:
      operationId: listSongs
      tags: [songs]
      summary: List all songs
      responses:
        "200":
          description: List of songs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Song"
    post:
      operationId: createSong
      tags: [songs]
      summary: Create a new song
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SongInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"

  /songs/stats:
    get:
      operationId: getSongStats
      tags: [songs]
      summary: Get song statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongStats"

  /songs/{id}:
    get:
      operationId: getSong
      tags: [songs]
      summary: Get a single song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Song
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "404":
          description: Not found
    patch:
      operationId: updateSong
      tags: [songs]
      summary: Update a song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SongUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "404":
          description: Not found
    delete:
      operationId: deleteSong
      tags: [songs]
      summary: Delete a song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /songs/{id}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments on a song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Post a comment on a song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          description: Song not found

  /songs/{id}/takes:
    get:
      operationId: listTakes
      tags: [takes]
      summary: List collaborator takes on a song
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of takes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Take"
    post:
      operationId: uploadTake
      tags: [takes]
      summary: Upload a collaborator take (multipart audio, handled by multer)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Take"
        "404":
          description: Song not found

  /songs/{songId}/takes/{takeId}:
    patch:
      operationId: updateTake
      tags: [takes]
      summary: Adjust mix settings for a take
      parameters:
        - name: songId
          in: path
          required: true
          schema:
            type: integer
        - name: takeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Take"
        "404":
          description: Not found
    delete:
      operationId: deleteTake
      tags: [takes]
      summary: Remove a take
      parameters:
        - name: songId
          in: path
          required: true
          schema:
            type: integer
        - name: takeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /songs/{songId}/takes/{takeId}/audio:
    get:
      operationId: streamTakeAudio
      tags: [takes]
      summary: Stream a take's audio
      parameters:
        - name: songId
          in: path
          required: true
          schema:
            type: integer
        - name: takeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audio stream
          content:
            audio/*:
              schema:
                type: string
                format: binary

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Song:
      type: object
      required: [id, title, hasAudio, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        notes:
          type: ["string", "null"]
        tags:
          type: ["string", "null"]
        duration:
          type: ["number", "null"]
          description: Duration in seconds
        audioUrl:
          type: ["string", "null"]
          description: URL to stream the audio file
        hasAudio:
          type: boolean
        waveformData:
          type: ["array", "null"]
          items:
            type: number
          description: Amplitude peak values (0–1) for waveform visualization
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SongInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        notes:
          type: string
        tags:
          type: string

    SongUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        notes:
          type: string
        tags:
          type: string

    Comment:
      type: object
      required: [id, songId, author, body, createdAt]
      properties:
        id:
          type: integer
        songId:
          type: integer
        author:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    CommentInput:
      type: object
      required: [author, body]
      properties:
        author:
          type: string
          minLength: 1
          maxLength: 60
        body:
          type: string
          minLength: 1
          maxLength: 2000

    Take:
      type: object
      required: [id, songId, author, audioUrl, offsetMs, volume, pan, createdAt]
      properties:
        id:
          type: integer
        songId:
          type: integer
        author:
          type: string
        audioUrl:
          type: string
        duration:
          type: ["number", "null"]
        waveformData:
          type: ["array", "null"]
          items:
            type: number
        offsetMs:
          type: integer
        volume:
          type: number
        pan:
          type: number
        createdAt:
          type: string
          format: date-time

    TakeUpdate:
      type: object
      properties:
        volume:
          type: number
          minimum: 0
          maximum: 2
        pan:
          type: number
          minimum: -1
          maximum: 1
        offsetMs:
          type: integer
          minimum: -5000
          maximum: 5000

    Musician:
      type: object
      required: [id, name, instrument, city, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        instrument:
          type: string
        genre:
          type: ["string", "null"]
        city:
          type: string
        bio:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    MusicianInput:
      type: object
      required: [name, instrument, city]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        instrument:
          type: string
          minLength: 1
          maxLength: 80
        genre:
          type: string
          maxLength: 80
        city:
          type: string
          minLength: 1
          maxLength: 100
        bio:
          type: string
          maxLength: 500
        contactEmail:
          type: string
          maxLength: 120
        lat:
          type: number
        lng:
          type: number

    SongStats:
      type: object
      required: [totalSongs, totalDuration, songsWithAudio, recentSongs]
      properties:
        totalSongs:
          type: integer
        totalDuration:
          type: number
          description: Total duration of all songs in seconds
        songsWithAudio:
          type: integer
        recentSongs:
          type: array
          items:
            $ref: "#/components/schemas/Song"
